<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Root and kaizenctl user can own the D-Bus service -->
  <policy user="root">
    <allow own="org.kaizen.PowerTool"/>
    <allow send_destination="org.kaizen.PowerTool"/>
    <allow receive_sender="org.kaizen.PowerTool"/>
  </policy>

  <policy user="kaizenctl">
    <allow own="org.kaizen.PowerTool"/>
    <allow send_destination="org.kaizen.PowerTool"/>
    <allow receive_sender="org.kaizen.PowerTool"/>
  </policy>

  <!-- Members of kaizenctl group have full control -->
  <policy group="kaizenctl">
    <allow send_destination="org.kaizen.PowerTool"/>
    <allow receive_sender="org.kaizen.PowerTool"/>
  </policy>

  <!-- Active local desktop sessions can query metrics and invoke methods -->
  <policy context="default">
    <allow send_destination="org.kaizen.PowerTool"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.kaizen.PowerTool"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.kaizen.PowerTool"/>
    <allow receive_sender="org.kaizen.PowerTool"/>
  </policy>
</busconfig>
